<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <meta name="theme-color" content="#0849B3">
  <!-- Canonical + og:url are added automatically from SITE_CONFIG.siteUrl once the production domain is confirmed. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Zen Laundry">
  <meta property="og:title" content="{{og_title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="assets/images/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Neatly folded clean laundry in a bright laundromat">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/images/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  {{preload_tag}}
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/config.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</head>
<body>
